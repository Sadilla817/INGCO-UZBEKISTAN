<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>INGCO Store</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, push, onValue, remove } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyB7mIOGY-bdNLVTzflXOl3t9bDLaQiLbKs",
            authDomain: "ingco-store.firebaseapp.com",
            databaseURL: "https://ingco-store-default-rtdb.firebaseio.com",
            projectId: "ingco-store",
            storageBucket: "ingco-store.firebasestorage.app",
            messagingSenderId: "286206400336",
            appId: "1:286206400336:web:f39161a02e514512d3fe55"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const adminChatId = "5667696089";
        const botToken = "8546147813:AAHiZp8z236sJAwfItgM4yUFyijaMBHBP6U";

        window.cart = [];
        window.favorites = JSON.parse(localStorage.getItem('ingco_favs')) || [];

        // MAHSULOTLARNI CHIQARISH
        onValue(ref(db, 'products'), (snapshot) => {
            const list = document.getElementById('product-list');
            const wishList = document.getElementById('wish-list-items');
            list.innerHTML = '';
            wishList.innerHTML = '';
            
            const data = snapshot.val();
            if(!data) return;

            for (let id in data) {
                const isFav = window.favorites.includes(id);
                const itemHtml = `
                    <div class="product-card">
                        ${window.currentUserId == adminChatId ? `<i class="fa fa-trash delete-icon" onclick="deleteProduct('${id}')"></i>` : ''}
                        <i class="fa${isFav ? 's' : 'r'} fa-heart wish-icon ${isFav ? 'active' : ''}" onclick="toggleWish('${id}')"></i>
                        <img src="${data[id].img}" alt="img" onerror="this.src='https://via.placeholder.com/150?text=Rasm+Xato'">
                        <p><b>${data[id].name}</b></p>
                        <p class="new-price">${data[id].newP} so'm</p>
                        <button class="btn-main" onclick="addToCart('${data[id].name}', ${data[id].newP})">🛒 Savatga</button>
                    </div>`;
                
                list.innerHTML += itemHtml;
                if(isFav) wishList.innerHTML += itemHtml;
            }
        });

        // TANLANGANLAR FUNKSIYASI
        window.toggleWish = function(id) {
            if(window.favorites.includes(id)) {
                window.favorites = window.favorites.filter(f => f !== id);
            } else {
                window.favorites.push(id);
                Telegram.WebApp.HapticFeedback.impactOccurred('medium');
            }
            localStorage.setItem('ingco_favs', JSON.stringify(window.favorites));
            location.reload(); // Ro'yxatni yangilash uchun
        };

        // SAVAT FUNKSIYALARI
        window.addToCart = function(name, price) {
            window.cart.push({name, price});
            document.getElementById('cart-count').innerText = window.cart.length;
            Telegram.WebApp.HapticFeedback.notificationOccurred('success');
        };

        window.renderCart = function() {
            const cartItemsDiv = document.getElementById('cart-items-list');
            const cartTotal = document.getElementById('cart-total-sum');
            cartItemsDiv.innerHTML = '';
            let total = 0;

            if(window.cart.length === 0) {
                cartItemsDiv.innerHTML = '<p style="text-align:center;">Savat bo\'sh</p>';
                cartTotal.innerText = '0';
                return;
            }

            window.cart.forEach((item, index) => {
                total += parseInt(item.price);
                cartItemsDiv.innerHTML += `
                    <div class="cart-item-row">
                        <span>${item.name}</span>
                        <span><b>${item.price}</b> <i class="fa fa-times" onclick="removeFromCart(${index})" style="color:red; margin-left:10px;"></i></span>
                    </div>`;
            });
            cartTotal.innerText = total;
        };

        window.removeFromCart = function(index) {
            window.cart.splice(index, 1);
            document.getElementById('cart-count').innerText = window.cart.length;
            window.renderCart();
        };

        window.deleteProduct = function(id) {
            if(confirm("O'chirilsinmi?")) remove(ref(db, `products/${id}`));
        };

        window.addProduct = function() {
            const name = document.getElementById('p_name').value;
            const oldP = document.getElementById('p_old_price').value;
            const newP = document.getElementById('p_new_price').value;
            const img = document.getElementById('p_img_url').value;
            if(name && newP && img) {
                push(ref(db, 'products'), { name, oldP, newP, img });
                alert("Qo'shildi!");
                document.getElementById('add-form').reset();
            }
        };

        window.sendOrder = function() {
            const region = document.getElementById('region_select').value;
            const phone = document.getElementById('user_phone').value;
            if(region && phone && window.cart.length > 0) {
                let msg = `📦 BUYURTMA!\n📍 Viloyat: ${region}\n📞 Tel: ${phone}\n\n`;
                window.cart.forEach(i => msg += `• ${i.name} (${i.price})\n`);
                msg += `\n💰 Jami: ${document.getElementById('cart-total-sum').innerText} so'm`;

                fetch(`https://api.telegram.org/bot${botToken}/sendMessage?chat_id=${adminChatId}&text=${encodeURIComponent(msg)}`)
                .then(() => {
                    alert("Buyurtma yuborildi!");
                    window.cart = [];
                    document.getElementById('cart-count').innerText = '0';
                    showPage('home', document.getElementById('nav-home'));
                });
            }
        };
    </script>

    <style>
        :root { --main-color: #f39c12; }
        body { font-family: sans-serif; margin: 0; background: #f4f4f4; padding-bottom: 70px; }
        .page { display: none; padding: 15px; }
        .active { display: block; }
        .catalog-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .product-card { background: #fff; padding: 10px; border-radius: 10px; text-align: center; position: relative; }
        .product-card img { width: 100%; height: 110px; object-fit: contain; }
        .delete-icon { position: absolute; top: 5px; left: 5px; color: red; }
        .wish-icon { position: absolute; top: 8px; right: 8px; color: #ccc; font-size: 20px; }
        .wish-icon.active { color: red; }
        .new-price { font-weight: bold; color: #d35400; }
        .cart-item-row { display: flex; justify-content: space-between; background: #fff; padding: 10px; margin-bottom: 5px; border-radius: 8px; font-size: 13px; }
        .nav-bar { position: fixed; bottom: 0; width: 100%; background: #fff; display: flex; border-top: 1px solid #ddd; z-index: 1000; }
        .nav-item { flex: 1; text-align: center; padding: 10px 0; font-size: 10px; color: #888; position: relative; }
        .active-nav { color: var(--main-color); }
        #cart-count { position: absolute; top: 2px; right: 25%; background: red; color: #fff; border-radius: 50%; padding: 2px 6px; font-size: 9px; }
        .btn-main { background: var(--main-color); color: #000; border: none; padding: 10px; width: 100%; border-radius: 8px; font-weight: bold; cursor: pointer; }
        input, select { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; }
    </style>
</head>
<body>

<div id="home" class="page active">
    <h3 style="text-align: center;">INGCO Katalog</h3>
    <div class="catalog-grid" id="product-list"></div>
</div>

<div id="saved-page" class="page">
    <h3>❤️ Saqlanganlar</h3>
    <div class="catalog-grid" id="wish-list-items"></div>
</div>

<div id="cart-page" class="page">
    <h3>🛒 Savatchangiz</h3>
    <div id="cart-items-list"></div>
    <div style="margin-top:15px; font-weight:bold;">Jami: <span id="cart-total-sum">0</span> so'm</div>
    <hr>
    <select id="region_select">
        <option value="">Viloyat...</option>
        <option value="Toshkent">Toshkent</option>
        <option value="Andijon">Andijon</option>
    </select>
    <input type="tel" id="user_phone" placeholder="901234567">
    <button class="btn-main" onclick="sendOrder()">Tasdiqlash</button>
</div>

<div id="profile" class="page">
    <div id="admin-panel" style="display:none;">
        <h3>⚙️ Admin</h3>
        <form id="add-form">
            <input type="text" id="p_img_url" placeholder="Rasm URL">
            <input type="text" id="p_name" placeholder="Nomi">
            <input type="number" id="p_old_price" placeholder="Eski narx">
            <input type="number" id="p_new_price" placeholder="Yangi narx">
            <button type="button" class="btn-main" onclick="addProduct()">Qo'shish</button>
        </form>
    </div>
    <p style="text-align:center;">ID: <b id="u_id"></b></p>
</div>

<div class="nav-bar">
    <div class="nav-item active-nav" id="nav-home" onclick="showPage('home', this)"><i class="fa fa-home"></i><br>UY</div>
    <div class="nav-item" onclick="showPage('saved-page', this)"><i class="fa fa-heart"></i><br>SEVIMLI</div>
    <div class="nav-item" onclick="showPage('cart-page', this)"><span id="cart-count">0</span><i class="fa fa-shopping-cart"></i><br>SAVAT</div>
    <div class="nav-item" id="admin-tab" onclick="showPage('profile', this)"><i class="fa fa-user"></i><br>PROFIL</div>
</div>

<script>
    let tg = window.Telegram.WebApp;
    tg.expand();
    const adminChatId = "5667696089";
    window.currentUserId = tg.initDataUnsafe.user ? tg.initDataUnsafe.user.id : "Test";
    document.getElementById('u_id').innerText = window.currentUserId;
    if(window.currentUserId == adminChatId) document.getElementById('admin-panel').style.display = 'block';

    window.showPage = function(pId, el) {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.getElementById(pId).classList.add('active');
        document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active-nav'));
        el.classList.add('active-nav');
        if(pId === 'cart-page') window.renderCart();
    };
</script>
</body>
</html>
