<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>INGCO Store Pro</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --main: #f39c12; }
        body { font-family: sans-serif; margin: 0; background: #f4f4f4; padding-bottom: 90px; }
        .page { display: none; padding: 15px; }
        .active { display: block; }
        .card { background: #fff; border-radius: 12px; margin-bottom: 10px; padding: 12px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); position: relative; cursor: pointer; display: flex; flex-direction: column; justify-content: space-between; }
        img { width: 100%; height: 140px; object-fit: contain; border-radius: 8px; background: #eee; margin-bottom: 8px; }
        
        /* 2 ustunli ko'rinish */
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        
        .price { color: #d35400; font-weight: bold; font-size: 1em; margin: 5px 0; }
        
        /* Opisaniya uchun 58 qatorgacha joy */
        .desc-text { 
            font-size: 0.85em; 
            color: #555; 
            display: -webkit-box; 
            -webkit-line-clamp: 58; 
            -webkit-box-orient: vertical; 
            overflow: hidden; 
            margin: 5px 0; 
            line-height: 1.4;
            word-wrap: break-word;
        }

        .btn-main { background: var(--main); border: none; padding: 10px; width: 100%; border-radius: 8px; font-weight: bold; color: white; cursor: pointer; margin-top: auto; text-align: center; font-size: 0.9em; }
        
        /* Modal */
        #product-modal { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:white; z-index:2000; overflow-y:auto; padding:20px; box-sizing:border-box; }
        .close-modal { position:fixed; top:15px; right:15px; font-size:20px; background:#eee; border-radius:50%; width:35px; height:35px; display:flex; align-items:center; justify-content:center; z-index:2100; }

        .nav-bar { position: fixed; bottom: 0; width: 100%; background: #fff; display: flex; border-top: 1px solid #ddd; height: 65px; z-index: 1000; }
        .nav-item { flex: 1; text-align: center; padding: 10px 0; font-size: 11px; color: #888; position: relative; }
        .active-nav { color: var(--main); }
        .badge { position: absolute; top: 5px; right: 25%; background: red; color: white; border-radius: 50%; padding: 2px 6px; font-size: 10px; }
        
        .delete-icon { position: absolute; top: 8px; left: 8px; color: red; background: rgba(255,255,255,0.9); border-radius: 50%; padding: 5px; z-index: 10; font-size: 12px; }
        input, select, textarea { width: 100%; padding: 10px; margin: 5px 0; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; }
        .cart-item { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #eee; }
    </style>
</head>
<body>

<div id="product-modal">
    <div class="close-modal" onclick="window.closeModal()"><i class="fa fa-times"></i></div>
    <div id="modal-content"></div>
</div>

<div id="home" class="page active">
    <h3 id="cat-title" style="margin-left: 5px;">Kataloglar</h3>
    <div class="grid" id="main-grid"></div>
</div>

<div id="news-page" class="page">
    <div id="news-list"></div>
</div>

<div id="cart-page" class="page">
    <h3>Savatchangiz</h3>
    <div id="cart-items-list"></div>
    <div id="cart-summary" class="card" style="display:none; margin-top: 20px;">
        <h3 style="text-align:right">Jami: <span id="total-price">0</span></h3>
        <input type="tel" id="user-phone" placeholder="Telefon (Masalan: 991234567)">
        <select id="user-region" onchange="window.updateDistricts()"></select>
        <select id="user-district"></select>
        <button class="btn-main" onclick="window.sendOrder()" style="font-size: 1.1em; padding: 15px;">BUYURTMA BERISH</button>
    </div>
</div>

<div id="profile" class="page">
    <div id="admin-panel" style="display:none;">
        <div class="card">
            <h4>📁 Katalog Yaratish</h4>
            <input type="text" id="cat_img" placeholder="Katalog rasm linki">
            <input type="text" id="cat_name" placeholder="Katalog nomi">
            <button class="btn-main" onclick="window.addCat()">Yaratish</button>
        </div>
        <div class="card">
            <h4>📦 Mahsulot Qo'shish</h4>
            <input type="text" id="p_img" placeholder="Rasm linki">
            <input type="text" id="p_name" placeholder="Nomi">
            <input type="number" id="p_price" placeholder="Narxi">
            <textarea id="p_desc" rows="4" placeholder="Tavsif (Har qatorga 4 ta so'z yozish tavsiya etiladi)"></textarea>
            <select id="p_cat_select"></select>
            <button class="btn-main" onclick="window.addProd()">Qo'shish</button>
        </div>
    </div>
</div>

<div class="nav-bar">
    <div class="nav-item active-nav" id="nav-home" onclick="window.loadCategories()"><i class="fa fa-th-large"></i><br>Katalog</div>
    <div class="nav-item" id="nav-news" onclick="window.showPage('news-page', this)"><i class="fa fa-bell"></i><br>Yangiliklar</div>
    <div class="nav-item" id="nav-cart" onclick="window.openCart()"><span id="cart-count" class="badge">0</span><i class="fa fa-shopping-cart"></i><br>Savat</div>
    <div id="admin-tab" class="nav-item" style="display:none;" onclick="window.showPage('profile', this)"><i class="fa fa-user-cog"></i><br>Admin</div>
</div>
