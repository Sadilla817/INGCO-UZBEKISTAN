<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>INGCO Store</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --main-color: #ffbe00; --bg-color: #f4f4f4; }
        body { font-family: sans-serif; margin: 0; padding-bottom: 70px; background: var(--bg-color); }
        
        /* Header */
        header { background: #333; color: white; padding: 15px; text-align: center; position: sticky; top: 0; z-index: 100; }
        
        /* Product Card */
        .container { padding: 10px; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .product-card { background: white; border-radius: 10px; padding: 10px; position: relative; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .product-card img { width: 100%; border-radius: 5px; }
        .badge { position: absolute; top: 5px; left: 5px; background: red; color: white; padding: 2px 5px; border-radius: 3px; font-size: 12px; }
        .price { font-weight: bold; color: #333; }
        .old-price { text-decoration: line-through; color: gray; font-size: 12px; }

        /* Bottom Navigation */
        .bottom-nav { position: fixed; bottom: 0; width: 100%; background: white; display: flex; justify-content: space-around; padding: 10px 0; border-top: 1px solid #ddd; }
        .nav-item { text-align: center; color: #666; font-size: 12px; text-decoration: none; flex: 1; }
        .nav-item i { font-size: 20px; display: block; margin-bottom: 3px; }
        .nav-item.active { color: var(--main-color); }

        /* Sections */
        .section { display: none; padding: 15px; }
        .active-section { display: block; }

        /* Form Style */
        input, select { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ddd; border-radius: 5px; }
        .btn-order { background: var(--main-color); color: #333; border: none; width: 100%; padding: 12px; font-weight: bold; border-radius: 5px; }
    </style>
</head>
<body>

<header>
    <h2 id="page-title">INGCO Tools</h2>
</header>

<div id="home" class="section active-section">
    <div class="container">
        <div class="product-card">
            <span class="badge">-10%</span>
            <img src="https://via.placeholder.com/150" alt="Drill">
            <h4>Drill Ingco</h4>
            <div class="old-price">800,000 so'm</div>
            <div class="price">720,000 so'm</div>
            <button class="btn-order" onclick="addToCart('Drill', 720000)">Savatga</button>
        </div>
    </div>
</div>

<div id="cart" class="section">
    <h3>Savatcha</h3>
    <div id="cart-items"></div>
    <hr>
    <input type="text" id="name" placeholder="Ismingiz (Majburiy)">
    <input type="tel" id="phone" placeholder="Telefon raqamingiz (Majburiy)">
    <input type="text" id="promo" placeholder="Promokod">
    <select id="pay-method">
        <option value="karta">Karta orqali</option>
        <option value="naqd">Naqd pul</option>
        <option value="nasiya">Nasiya savdo</option>
        <option value="perechisleniye">Perechisleniye</option>
    </select>
    <p>Jami: <b id="total-price">0</b> so'm</p>
    <button class="btn-order" onclick="sendOrder()">Buyurtma berish</button>
</div>

<div id="fav" class="section">
    <h3>Tanlanganlar</h3>
    <p>Hozircha hech narsa yo'q.</p>
</div>

<div id="profile" class="section">
    <h3>Profil / Admin Panel</h3>
    <button class="btn-order" style="background: #333; color: white;">Mahsulot qo'shish (Admin)</button>
    <p>Sizning ID: <span id="user-id">Yuklanmoqda...</span></p>
</div>

<nav class="bottom-nav">
    <a href="#" class="nav-item active" onclick="showSection('home', this)"><i class="fa fa-home"></i>Uy</a>
    <a href="#" class="nav-item" onclick="showSection('cart', this)"><i class="fa fa-shopping-cart"></i>Savat</a>
    <a href="#" class="nav-item" onclick="showSection('fav', this)"><i class="fa fa-heart"></i>Yurakcha</a>
    <a href="#" class="nav-item" onclick="showSection('profile', this)"><i class="fa fa-user"></i>Profil</a>
</nav>

<script>
    let tg = window.Telegram.WebApp;
    tg.expand();
    document.getElementById('user-id').innerText = tg.initDataUnsafe.user?.id || "Noma'lum";

    let cart = [];

    function showSection(id, element) {
        document.querySelectorAll('.section').forEach(s => s.classList.remove('active-section'));
        document.getElementById(id).classList.add('active-section');
        
        document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
        element.classList.add('active');
        document.getElementById('page-title').innerText = element.innerText;
    }

    function addToCart(name, price) {
        cart.push({name, price});
        updateCart();
        alert(name + " savatga qo'shildi!");
    }

    function updateCart() {
        let itemsDiv = document.getElementById('cart-items');
        let total = 0;
        itemsDiv.innerHTML = "";
        cart.forEach(item => {
            itemsDiv.innerHTML += `<p>${item.name} - ${item.price} so'm</p>`;
            total += item.price;
        });
        document.getElementById('total-price').innerText = total;
    }

    function sendOrder() {
        let name = document.getElementById('name').value;
        let phone = document.getElementById('phone').value;
        if(!name || !phone) { alert("Ism va tel raqamni kiriting!"); return; }

        let message = `Yangi buyurtma!\n👤 Ism: ${name}\n📞 Tel: ${phone}\n🛒 Mahsulotlar: ${cart.length} ta\n💰 Jami: ${document.getElementById('total-price').innerText} so'm`;
        
        tg.sendData(message); // Ma'lumotni botga yuboradi
        tg.close();
    }
</script>

</body>
</html>
