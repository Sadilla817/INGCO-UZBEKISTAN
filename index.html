<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>INGCO DO'MBIROBOD</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <script type="module">
        // Firebase modullarini CDN orqali yuklash
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // Siz yuborgan Firebase konfiguratsiyasi
        const firebaseConfig = {
            apiKey: "AIzaSyAcb8ZZIVtL1ELFA4ubFGHJHkyywClDK8I",
            authDomain: "ingco-dombrabad.firebaseapp.com",
            projectId: "ingco-dombrabad",
            storageBucket: "ingco-dombrabad.firebasestorage.app",
            messagingSenderId: "1005593055316",
            appId: "1:1005593055316:web:1bc5f4d0ffd784c1ae9dc1",
            measurementId: "G-15RR0XR2LZ"
        };

        // Firebase-ni ishga tushirish
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Mahsulotlarni bazadan real vaqtda o'qish
        const q = query(collection(db, "products"), orderBy("createdAt", "desc"));
        onSnapshot(q, (snapshot) => {
            const list = document.getElementById('product-list');
            list.innerHTML = "";
            snapshot.forEach((doc) => {
                const p = doc.data();
                const discountTag = p.discount > 0 ? `<div class="discount">-${p.discount}%</div>` : "";
                list.innerHTML += `
                    <div class="card">
                        ${discountTag}
                        <img src="${p.img}" onerror="this.src='https://via.placeholder.com/150?text=INGCO'">
                        <h4>${p.name}</h4>
                        <div class="price">${Number(p.price).toLocaleString()} so'm</div>
                        <button class="btn-main" onclick="addToCart('${p.name}', ${p.price})">Savatga</button>
                    </div>`;
            });
        });

        // Mahsulot qo'shish funksiyasi (Admin Panel uchun)
        window.addNewProduct = async function() {
            const name = document.getElementById('p-name').value;
            const price = document.getElementById('p-price').value;
            const img = document.getElementById('p-img').value;
            const discount = document.getElementById('p-disc').value || 0;

            if(!name || !price || !img) return alert("Nom, narx va rasm linkini kiriting!");

            try {
                await addDoc(collection(db, "products"), {
                    name, price, img, discount: Number(discount),
                    createdAt: new Date()
                });
                alert("Mahsulot bazaga qo'shildi!");
                document.getElementById('admin-modal').style.display = 'none';
                // Formani tozalash
                document.getElementById('p-name').value = "";
                document.getElementById('p-price').value = "";
                document.getElementById('p-img').value = "";
            } catch (e) { 
                alert("Xatolik: " + e.message); 
            }
        }
    </script>

    <style>
        :root { --ingco-yellow: #FBB03B; --ingco-black: #1A1A1B; }
        body { font-family: sans-serif; margin: 0; background: #fdfdfd; padding-bottom: 80px; }
        header { background: var(--ingco-black); color: var(--ingco-yellow); padding: 12px; text-align: center; font-weight: bold; border-bottom: 2px solid var(--ingco-yellow); position: sticky; top: 0; z-index: 100; }
        .container { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 10px; }
        .card { background: white; border-radius: 8px; padding: 10px; position: relative; border: 1px solid #ddd; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .card img { width: 100%; height: 110px; object-fit: contain; }
        .discount { position: absolute; top: 5px; left: 5px; background: red; color: white; padding: 2px 5px; border-radius: 4px; font-size: 10px; font-weight: bold; }
        .btn-main { background: var(--ingco-yellow); color: #000; border: none; padding: 10px; width: 100%; font-weight: bold; border-radius: 6px; margin-top: 5px; cursor: pointer; }
        .bottom-nav { position: fixed; bottom: 0; width: 100%; background: var(--ingco-black); display: flex; padding: 10px 0; border-top: 2px solid var(--ingco-yellow); }
        .nav-link { text-align: center; color: #888; font-size: 10px; text-decoration: none; flex: 1; }
        .nav-link.active { color: var(--ingco-yellow); }
        .page { display: none; padding: 15px; }
        .page.active { display: block; }
        .modal { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:white; z-index:1000; padding:20px; box-sizing:border-box; overflow-y:auto; }
        input { width:100%; padding:12px; margin:8px 0; border:1px solid #ccc; border-radius:6px; box-sizing: border-box; }
    </style>
</head>
<body>

<header>INGCO DO'MBIROBOD</header>

<div id="home-page" class="page active">
    <div class="container" id="product-list">
        </div>
</div>

<div id="admin-modal" class="modal">
    <h3>Yangi mahsulot qo'shish</h3>
    <input type="text" id="p-name" placeholder="Mahsulot nomi">
    <input type="number" id="p-price" placeholder="Narxi (faqat raqam)">
    <input type="text" id="p-img" placeholder="Rasm linki (URL)">
    <input type="number" id="p-disc" placeholder="Chegirma % (ixtiyoriy)">
    <button class="btn-main" onclick="addNewProduct()">BAZAGA SAQLASH</button>
    <button onclick="document.getElementById('admin-modal').style.display='none'" style="width:100%; border:none; background:none; color:red; margin-top:15px; font-weight:bold;">BEKOR QILISH</button>
</div>

<div id="profile-page" class="page">
    <h3>Admin Boshqaruvi</h3>
    <div style="background: #eee; padding: 20px; border-radius: 10px; text-align: center;">
        <p>Yangi mahsulotlarni ushbu tugma orqali qo'shishingiz mumkin:</p>
        <button class="btn-main" onclick="document.getElementById('admin-modal').style.display='block'">+ MAHSULOT QO'SHISH</button>
    </div>
</div>

<nav class="bottom-nav">
    <a href="#" class="nav-link active" onclick="switchPage('home-page', this)"><i class="fa fa-th-large" style="display:block; font-size:18px;"></i> Bosh Sahifa</a>
    <a href="#" class="nav-link" onclick="switchPage('profile-page', this)"><i class="fa fa-user-circle" style="display:block; font-size:18px;"></i> Admin</a>
</nav>

<script>
    let tg = window.Telegram.WebApp;
    tg.expand();
// O'zingizning Telegram ID raqamingizni shu yerga yozing
const ADMIN_ID = 5667696089; 

// Foydalanuvchi ma'lumotlarini olish
const user = tg.initDataUnsafe?.user;

// Agar kirgan odam admin bo'lmasa, Admin tugmasini o'chirib tashlash
if (!user || user.id !== ADMIN_ID) {
    const adminLink = document.querySelector('a[onclick*="profile-page"]');
    if (adminLink) {
        adminLink.style.display = 'none'; // Pastki menyudan yo'qotish
    }
}
    function switchPage(p, el) {
        document.querySelectorAll('.page').forEach(x => x.classList.remove('active'));
        document.getElementById(p).classList.add('active');
        document.querySelectorAll('.nav-link').forEach(x => x.classList.remove('active'));
        el.classList.add('active');
        tg.HapticFeedback.impactOccurred('light');
    }

    function addToCart(n, p) {
        tg.HapticFeedback.notificationOccurred('success');
        alert(n + " savatga qo'shildi!");
    }
</script>
</body>
</html>
