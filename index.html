<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>INGCO Store</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, push, onValue, remove } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyB7mIOGY-bdNLVTzflXOl3t9bDLaQiLbKs",
            authDomain: "ingco-store.firebaseapp.com",
            databaseURL: "https://ingco-store-default-rtdb.firebaseio.com",
            projectId: "ingco-store",
            storageBucket: "ingco-store.firebasestorage.app",
            messagingSenderId: "286206400336",
            appId: "1:286206400336:web:f39161a02e514512d3fe55"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const adminChatId = "5667696089";
        const botToken = "8546147813:AAHiZp8z236sJAwfItgM4yUFyijaMBHBP6U";

        window.cart = [];
        window.currentCategory = "Hammasi";
        let allProducts = {};
        let allCategories = [];

        // MAHSULOTLARNI O'QISH
        onValue(ref(db, 'products'), (snapshot) => {
            allProducts = snapshot.val() || {};
            renderProducts();
        });

        // KATEGORIYALARNI O'QISH
        onValue(ref(db, 'categories'), (snapshot) => {
            const data = snapshot.val();
            allCategories = data ? Object.values(data) : [];
            renderCategoryUI();
        });

        function renderCategoryUI() {
            const scrollBox = document.getElementById('category-scroll');
            const selectBox = document.getElementById('p_cat');
            
            // Mijoz filtri
            scrollBox.innerHTML = `<button class="cat-btn ${window.currentCategory === 'Hammasi' ? 'active-cat' : ''}" onclick="filterCategory('Hammasi')">Hammasi</button>`;
            allCategories.forEach(cat => {
                scrollBox.innerHTML += `<button class="cat-btn ${window.currentCategory === cat ? 'active-cat' : ''}" onclick="filterCategory('${cat}')">${cat}</button>`;
            });

            // Admin select
            selectBox.innerHTML = '<option value="">Katalog tanlang</option>';
            allCategories.forEach(cat => {
                selectBox.innerHTML += `<option value="${cat}">${cat}</option>`;
            });
        }

        window.filterCategory = function(cat) {
            window.currentCategory = cat;
            renderCategoryUI();
            renderProducts();
        };

        window.renderProducts = function() {
            const list = document.getElementById('product-list');
            list.innerHTML = '';
            for (let id in allProducts) {
                const p = allProducts[id];
                if (window.currentCategory !== "Hammasi" && p.category !== window.currentCategory) continue;
                
                list.innerHTML += `
                    <div class="product-card">
                        ${tg.initDataUnsafe.user?.id == adminChatId ? `<i class="fa fa-trash delete-icon" onclick="deleteProduct('${id}')"></i>` : ''}
                        <img src="${p.img}" onerror="this.src='https://via.placeholder.com/150?text=INGCO'">
                        <p class="p-name">${p.name}</p>
                        <p class="price">${Number(p.newP).toLocaleString()} so'm</p>
                        <button class="btn-main" onclick="addToCart('${p.name}', ${p.newP})">🛒 Savatga</button>
                    </div>`;
            }
        };

        window.addNewCategory = function() {
            const name = document.getElementById('new_cat_input').value.trim();
            if(name) {
                push(ref(db, 'categories'), name);
                document.getElementById('new_cat_input').value = '';
                alert("Katalog qo'shildi!");
            }
        };

        window.addProduct = function() {
            const name = document.getElementById('p_name').value;
            const price = document.getElementById('p_price').value;
            const img = document.getElementById('p_img').value;
            const cat = document.getElementById('p_cat').value;
            if(name && price && img && cat) {
                push(ref(db, 'products'), { name, newP: price, img, category: cat });
                alert("Tavar qo'shildi!");
                document.getElementById('add-form').reset();
            } else { alert("Ma'lumotlar to'liq emas!"); }
        };

        window.deleteProduct = function(id) {
            if(confirm("O'chirilsinmi?")) remove(ref(db, `products/${id}`));
        };

        window.addToCart = function(name, price) {
            window.cart.push({name, price});
            document.getElementById('cart-count').innerText = window.cart.length;
            Telegram.WebApp.HapticFeedback.notificationOccurred('success');
        };

        window.renderCart = function() {
            const box = document.getElementById('cart-items');
            box.innerHTML = '';
            let total = 0;
            window.cart.forEach((item, index) => {
                total += parseInt(item.price);
                box.innerHTML += `<div class="cart-row"><span>${item.name}</span><b>${item.price.toLocaleString()}</b> <i class="fa fa-times" onclick="removeFromCart(${index})" style="color:red"></i></div>`;
            });
            document.getElementById('total-sum').innerText = total.toLocaleString();
        };

        window.removeFromCart = function(index) {
            window.cart.splice(index, 1);
            document.getElementById('cart-count').innerText = window.cart.length;
            renderCart();
        };

        window.showPage = function(pId, el) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById(pId).classList.add('active');
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active-nav'));
            el.classList.add('active-nav');
            if(pId === 'cart-page') renderCart();
        };
    </script>

        body { font-family: sans-serif; margin: 0; background: #f4f4f4; padding-bottom: 70px; }
        .page { display: none; padding: 15px; }
        .active { display: block; }
        .category-scroll { display: flex; overflow-x: auto; gap: 8px; padding: 10px 0; }
        .cat-btn { background: #fff; border: 1px solid #ddd; padding: 7px 15px; border-radius: 20px; white-space: nowrap; }
        .active-cat { background: var(--main); font-weight: bold; border-color: var(--main); }
        .catalog-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .product-card { background: #fff; padding: 10px; border-radius: 12px; text-align: center; position: relative; }
        .product-card img { width: 100%; height: 110px; object-fit: contain; }
