<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>INGCO Store</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --main: #f39c12; }
        body { font-family: sans-serif; margin: 0; background: #f4f4f4; padding-bottom: 80px; }
        .page { display: none; padding: 10px; }
        .active { display: block; }
        
        /* 2 ustunli mahsulotlar */
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .card { background: #fff; border-radius: 12px; padding: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); position: relative; display: flex; flex-direction: column; }
        .card img { width: 100%; height: 110px; object-fit: contain; background: #f9f9f9; border-radius: 8px; margin-bottom: 8px; }
        
        .p-name { font-weight: bold; font-size: 14px; margin: 0; color: #222; min-height: 35px; }
        
        /* Tavsif - Maksimal 5 qator */
        .p-desc { 
            font-size: 11px; color: #666; margin: 5px 0;
            display: -webkit-box; -webkit-line-clamp: 5; -webkit-box-orient: vertical; 
            overflow: hidden; line-height: 1.3; height: 72px; /* 5 qator uchun taxminiy balandlik */
            word-break: break-word;
        }
        
        .p-price { color: #d35400; font-weight: bold; font-size: 14px; margin-bottom: 8px; }
        
        .btn-add { background: var(--main); border: none; padding: 10px; border-radius: 8px; color: white; font-weight: bold; cursor: pointer; width: 100%; display: flex; align-items: center; justify-content: center; gap: 5px; font-size: 12px; }

        /* Modal */
        #prod-modal { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:white; z-index:2000; overflow-y:auto; padding:20px; box-sizing:border-box; }
        .close-modal { position:fixed; top:15px; right:15px; font-size:24px; color: #333; z-index:2100; }

        .nav-bar { position: fixed; bottom: 0; width: 100%; background: #fff; display: flex; border-top: 1px solid #ddd; height: 65px; z-index: 1000; }
        .nav-item { flex: 1; text-align: center; padding: 10px 0; font-size: 11px; color: #888; position: relative; }
        .active-nav { color: var(--main); }
        .badge { position: absolute; top: 5px; right: 25%; background: red; color: white; border-radius: 50%; padding: 2px 6px; font-size: 10px; }
        
        .delete-btn { position: absolute; top: 5px; left: 5px; color: red; background: white; border-radius: 50%; padding: 5px; font-size: 12px; box-shadow: 0 0 5px rgba(0,0,0,0.2); z-index: 10; }
        input, select, textarea { width: 100%; padding: 10px; margin: 5px 0; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; }
    </style>
</head>
<body>

<div id="prod-modal">
    <i class="fa fa-times close-modal" onclick="window.closeModal()"></i>
    <div id="modal-content"></div>
</div>

<div id="home" class="page active">
    <h3 id="page-title">Kataloglar</h3>
    <div id="main-grid" class="grid"></div>
</div>

<div id="cart-page" class="page">
    <h3>Savatchangiz</h3>
    <div id="cart-list"></div>
    <div id="order-form" style="display:none; margin-top:15px;">
        <h4 style="text-align:right">Jami: <span id="total-price">0</span></h4>
        <input type="tel" id="u-phone" placeholder="Telefon (991234567)">
        <select id="u-region" onchange="window.updateCities()"></select>
        <select id="u-city"></select>
        <button class="btn-add" onclick="window.sendOrder()" style="padding:15px; font-size: 16px;">BUYURTMA BERISH</button>
    </div>
</div>

<div id="admin-page" class="page">
    <div class="card">
        <h4>📁 Yangi Katalog</h4>
        <input type="text" id="c-img" placeholder="Katalog rasm linki">
        <input type="text" id="c-name" placeholder="Katalog nomi">
        <button class="btn-add" onclick="window.saveCat()">Katalogni Yaratish</button>
    </div>
    <div class="card" style="margin-top:15px;">
        <h4>📦 Yangi Mahsulot</h4>
        <input type="text" id="p-img" placeholder="Rasm linki">
        <input type="text" id="p-name" placeholder="Mahsulot nomi">
        <textarea id="p-desc" rows="4" placeholder="Tavsif (Maksimal 25 ta so'z)"></textarea>
        <input type="number" id="p-price" placeholder="Narxi">
        <select id="p-cat-select"></select>
        <button class="btn-add" onclick="window.saveProd()">Mahsulotni Qo'shish</button>
    </div>
</div>

<div class="nav-bar">
    <div class="nav-item active-nav" id="btn-h" onclick="window.showHome()"><i class="fa fa-th-large"></i><br>Katalog</div>
    <div class="nav-item" id="btn-c" onclick="window.showCart()"><span id="c-count" class="badge">0</span><i class="fa fa-shopping-cart"></i><br>Savat</div>
    <div class="nav-item" id="btn-a" style="display:none;" onclick="window.showPage('admin-page', 'btn-a')"><i class="fa fa-user-cog"></i><br>Admin</div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getDatabase, ref, push, onValue, remove } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyB7mIOGY-bdNLVTzflXOl3t9bDLaQiLbKs",
        authDomain: "ingco-store.firebaseapp.com",
        databaseURL: "https://ingco-store-default-rtdb.firebaseio.com",
        projectId: "ingco-store",
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const adminChatId = "5667696089"; 
    const botToken = "8546147813:AAHiZp8z236sJAwfItgM4yUFyijaMBHBP6U";

    const regions = {"Toshkent": ["Yunusobod", "Chilonzor", "Mirzo Ulug'bek", "Sergeli"], "Andijon": ["Andijon sh.", "Asaka", "Shahrixon"], "Farg'ona": ["Farg'ona sh.", "Marg'ilon", "Qo'qon"]};
    let products = {}, cats = {}, cart = [];

    // So'zlarni cheklash funksiyasi
    function limitWords(str, limit) {
        if (!str) return "";
        const words = str.split(/\s+/);
        if (words.length > limit) {
            return words.slice(0, limit).join(" ") + "...";
        }
        return str;
    }

    onValue(ref(db, '/'), (snap) => {
        const data = snap.val() || {};
        products = data.products || {};
        cats = data.categories || {};
        window.showHome();
        
        const sel = document.getElementById('p-cat-select');
        if(sel) {
            sel.innerHTML = '<option value="">Katalog tanlang</option>';
            for(let id in cats) sel.innerHTML += `<option value="${cats[id].name}">${cats[id].name}</option>`;
        }
    });

    window.showHome = () => {
        window.showPage('home', 'btn-h');
        document.getElementById('page-title').innerText = "Kataloglar";
        const g = document.getElementById('main-grid');
        g.innerHTML = '';
        for(let id in cats) {
            g.innerHTML += `<div class="card" onclick="window.openCat('${cats[id].name}')">
                ${window.myId == adminChatId ? `<i class="fa fa-trash delete-btn" onclick="event.stopPropagation(); window.delItem('categories/${id}')"></i>` : ''}
                <img src="${cats[id].img}">
                <p style="text-align:center; font-weight:bold; margin:0;">${cats[id].name}</p>
            </div>`;
        }
    };

    window.openCat = (catName) => {
        document.getElementById('page-title').innerHTML = `<span onclick="window.showHome()" style="color:var(--main); cursor:pointer">← Ortga</span> | ${catName}`;
        const g = document.getElementById('main-grid');
        g.innerHTML = '';
        for(let id in products) {
            if(products[id].category == catName) {
                const p = products[id];
                const limitedDesc = limitWords(p.desc, 25);
                g.innerHTML += `<div class="card" onclick="window.openProd('${id}')">
                    ${window.myId == adminChatId ? `<i class="fa fa-trash delete-btn" onclick="event.stopPropagation(); window.delItem('products/${id}')"></i>` : ''}
                    <img src="${p.img}">
                    <p class="p-name">${p.name}</p>
                    <p class="p-desc">${limitedDesc}</p>
                    <p class="p-price">${Number(p.price).toLocaleString()} so'm</p>
                    <button class="btn-add" onclick="event.stopPropagation(); window.addCart('${id}')">
                        <i class="fa fa-shopping-cart"></i> Savatga
                    </button>
                </div>`;
            }
        }
    };

    window.openProd = (id) => {
        const p = products[id];
        document.getElementById('modal-content').innerHTML = `
            <img src="${p.img}" style="width:100%; height:280px; object-fit:contain;">
            <h2>${p.name}</h2>
            <p class="p-price" style="font-size:22px;">${Number(p.price).toLocaleString()} so'm</p>
            <hr style="border:0; border-top:1px solid #eee; margin:15px 0;">
            <p style="white-space:pre-wrap; line-height:1.6; color:#333;">${p.desc || ''}</p>
            <button class="btn-add" style="padding:15px; margin-top:25px; font-size:16px;" onclick="window.addCart('${id}'); window.closeModal()">🛒 SAVATGA SOLISH</button>
        `;
        document.getElementById('prod-modal').style.display = 'block';
    };

    window.closeModal = () => document.getElementById('prod-modal').style.display = 'none';

    window.addCart = (id) => {
        cart.push(products[id]);
        document.getElementById('c-count').innerText = cart.length;
        window.Telegram.WebApp.HapticFeedback.notificationOccurred('success');
    };

    window.showCart = () => {
        window.showPage('cart-page', 'btn-c');
        const l = document.getElementById('cart-list');
        const f = document.getElementById('order-form');
        l.innerHTML = ''; let total = 0;
        if(cart.length == 0) {
            l.innerHTML = '<p style="text-align:center; padding:40px; color:#888;">Savatchangiz bo\'sh</p>';
            f.style.display = 'none';
        } else {
            cart.forEach((p, i) => {
                total += Number(p.price);
                l.innerHTML += `<div style="display:flex; justify-content:space-between; align-items:center; padding:12px; border-bottom:1px solid #eee; background:#fff; margin-bottom:5px; border-radius:8px;">
                    <span style="font-size:14px; flex:1;">${p.name}</span>
                    <b style="color:var(--main); margin: 0 10px;">${Number(p.price).toLocaleString()}</b>
                    <i class="fa fa-trash" style="color:#e74c3c; cursor:pointer;" onclick="window.removeCart(${i})"></i>
                </div>`;
            });
            document.getElementById('total-price').innerText = total.toLocaleString() + " so'm";
            f.style.display = 'block';
            const r = document.getElementById('u-region');
            r.innerHTML = '<option value="">Viloyatni tanlang</option>';
            for(let key in regions) r.innerHTML += `<option value="${key}">${key}</option>`;
        }
    };

    window.removeCart = (i) => { cart.splice(i, 1); document.getElementById('c-count').innerText = cart.length; window.showCart(); };

    window.updateCities = () => {
        const r = document.getElementById('u-region').value;
        const c = document.getElementById('u-city');
        c.innerHTML = '<option value="">Tumanni tanlang</option>';
        if(regions[r]) regions[r].forEach(city => c.innerHTML += `<option value="${city}">${city}</option>`);
    };

    window.sendOrder = () => {
        const ph = document.getElementById('u-phone').value;
        const rg = document.getElementById('u-region').value;
        const ct = document.getElementById('u-city').value;
        if(!ph || !rg || !ct) return alert("Ma'lumotlarni to'liq to'ldiring!");
        
        let txt = `📦 YANGI BUYURTMA!\n\n📞 Tel: ${ph}\n📍 Manzil: ${rg}, ${ct}\n\n🛒 Mahsulotlar:\n`;
        let total = 0;
        cart.forEach(p => { txt += `• ${p.name} (${Number(p.price).toLocaleString()} so'm)\n`; total += Number(p.price); });
        txt += `\n💰 Jami summa: ${total.toLocaleString()} so'm`;

        fetch(`https://api.telegram.org/bot${botToken}/sendMessage`, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({chat_id: adminChatId, text: txt})
        }).then(() => { 
            alert("Rahmat! Buyurtmangiz qabul qilindi."); 
            cart = []; 
            document.getElementById('c-count').innerText = "0";
            window.showHome();
        });
    };

    window.saveCat = () => {
        const n = document.getElementById('c-name').value;
        const i = document.getElementById('c-img').value;
        if(n && i) {
            push(ref(db, 'categories'), {name: n, img: i});
            alert("Katalog yaratildi!");
            document.getElementById('c-name').value = ''; document.getElementById('c-img').value = '';
        }
    };

    window.saveProd = () => {
        const n = document.getElementById('p-name').value;
        const i = document.getElementById('p-img').value;
        const p = document.getElementById('p-price').value;
        const d = document.getElementById('p-desc').value;
        const c = document.getElementById('p-cat-select').value;
        if(n && i && p && c) {
            push(ref(db, 'products'), {name: n, img: i, price: p, desc: d, category: c});
            alert("Mahsulot qo'shildi!");
            document.getElementById('p-name').value = ''; document.getElementById('p-img').value = ''; document.getElementById('p-price').value = ''; document.getElementById('p-desc').value = '';
        } else {
            alert("Hamma kataklarni to'ldiring!");
        }
    };

    window.delItem = (path) => confirm("Haqiqatan ham o'chirmoqchimisiz?") && remove(ref(db, path));

    window.showPage = (id, btnId) => {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active-nav'));
        if(document.getElementById(btnId)) document.getElementById(btnId).classList.add('active-nav');
    };

    window.myId = window.Telegram.WebApp.initDataUnsafe.user?.id || "";
    if(window.myId == adminChatId) document.getElementById('btn-a').style.display = 'block';
    window.Telegram.WebApp.expand();
</script>
</body>
</html>
