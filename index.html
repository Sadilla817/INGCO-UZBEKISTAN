<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Do'kon va Admin Panel</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --tg-theme-button-color: #0088cc; }
        body { font-family: sans-serif; margin: 0; padding: 0; background: #f4f4f4; color: #333; }
        .container { padding-bottom: 80px; }
        .page { display: none; padding: 15px; }
        .active { display: block; }
        
        /* Katalog */
        .catalog-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .product-card { background: #fff; padding: 10px; border-radius: 12px; position: relative; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .product-card img { width: 100%; height: 120px; object-fit: cover; border-radius: 8px; }
        .old-price { text-decoration: line-through; color: #999; font-size: 12px; margin: 5px 0 0; }
        .new-price { font-weight: bold; color: #e67e22; margin: 0; }
        
        /* Pastki menyu */
        .nav-bar { position: fixed; bottom: 0; width: 100%; background: #fff; display: flex; justify-content: space-around; padding: 12px 0; border-top: 1px solid #ddd; z-index: 1000; }
        .nav-item { text-align: center; font-size: 10px; color: #888; cursor: pointer; flex: 1; }
        .nav-item i { font-size: 20px; margin-bottom: 4px; display: block; }
        .nav-item.active-nav { color: var(--tg-theme-button-color); }

        /* Admin tugmasi (Faqat sizga ko'rinadi) */
        #admin-link { display: none; color: #d35400; }

        /* Forma elementlari */
        input, select, button { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; }
        .btn-main { background: var(--tg-theme-button-color); color: white; border: none; font-weight: bold; }
        .error-border { border: 2px solid red !important; }
    </style>
</head>
<body>

<div class="container">
    <div id="home" class="page active">
        <h3>🏠 Katalog</h3>
        <div class="catalog-grid" id="product-list">
            <div class="product-card">
                <img src="https://via.placeholder.com/150" alt="product">
                <p style="margin: 5px 0;">Maxsulot nomi</p>
                <p class="old-price">180,000 so'm</p>
                <p class="new-price">150,000 so'm</p>
                <button class="btn-main" style="padding: 5px; font-size: 12px;">🛒 Savatga</button>
            </div>
        </div>
    </div>

    <div id="saved" class="page"><h3>❤️ Saqlanganlar</h3><p>Hozircha bo'sh...</p></div>

    <div id="cart" class="page">
        <h3>🛒 Savat</h3>
        <div id="cart-content">Savat bo'sh</div>
        <hr>
        <h4>Buyurtma berish</h4>
        <select id="region_select">
            <option value="">Viloyatni tanlang...</option>
            <option value="Toshkent">Toshkent</option>
            <option value="Samarqand">Samarqand</option>
            <option value="Buxoro">Buxoro</option>
        </select>
        <input type="tel" id="user_phone" placeholder="Telefon (masalan: 901234567)">
        <button class="btn-main" onclick="validateOrder()">Buyurtma berish</button>
    </div>

    <div id="profile" class="page">
        <h3>👤 Profil</h3>
        <div id="user-info">Login qilingan: <b id="user-id-display"></b></div>
        <hr>
        <div id="admin-panel" style="display: none;">
            <h3 style="color: #d35400;">⚙️ Admin Panel</h3>
            <p>Tavar qo'shish:</p>
            <input type="file" id="p_img" accept="image/*">
            <input type="text" id="p_name" placeholder="Tavar nomi">
            <input type="number" id="p_old_price" placeholder="Eski narxi">
            <input type="number" id="p_new_price" placeholder="Yangi narxi">
            <button class="btn-main" onclick="alert('Saqlandi (Backend kerak)')">Tavarni saqlash</button>
        </div>
    </div>
</div>

<div class="nav-bar">
    <div class="nav-item active-nav" onclick="showPage('home', this)"><i class="fa-solid fa-house"></i>UY</div>
    <div class="nav-item" onclick="showPage('saved', this)"><i class="fa-solid fa-heart"></i>SAQLANGANLAR</div>
    <div class="nav-item" onclick="showPage('cart', this)"><i class="fa-solid fa-cart-shopping"></i>SAVAT</div>
    <div class="nav-item" id="admin-tab" onclick="showPage('profile', this)"><i class="fa-solid fa-user"></i>PROFIL</div>
</div>

<script>
    let tg = window.Telegram.WebApp;
    tg.expand();
    
    // Sizning ID raqamingiz
    const ADMIN_ID = 5667696089;
    const currentUserId = tg.initDataUnsafe.user ? tg.initDataUnsafe.user.id : 0;

    // ID ni ko'rsatish
    document.getElementById('user-id-display').innerText = currentUserId;

    // Adminlikni tekshirish
    if (currentUserId === ADMIN_ID) {
        document.getElementById('admin-panel').style.display = 'block';
        document.getElementById('admin-tab').innerHTML = '<i class="fa-solid fa-lock"></i>ADMIN';
        document.getElementById('admin-tab').style.color = '#d35400';
    }

    function showPage(pageId, el) {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.getElementById(pageId).classList.add('active');
        document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active-nav'));
        el.classList.add('active-nav');
    }

    function validateOrder() {
        let region = document.getElementById('region_select');
        let phone = document.getElementById('user_phone');
        let valid = true;

        if (!region.value) { region.classList.add('error-border'); valid = false; }
        else { region.classList.remove('error-border'); }

        if (phone.value.length < 9) { phone.classList.add('error-border'); valid = false; }
        else { phone.classList.remove('error-border'); }

        if (!valid) {
            tg.showAlert("Xatolik! Ma'lumotlarni to'liq kiriting.");
        } else {
            tg.showConfirm("Buyurtma berishni tasdiqlaysizmi?", (confirm) => {
                if(confirm) tg.close();
            });
        }
    }
</script>

</body>
</html>
