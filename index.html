<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>INGCO Official Store</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, push, onValue, remove } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyB7mIOGY-bdNLVTzflXOl3t9bDLaQiLbKs",
            authDomain: "ingco-store.firebaseapp.com",
            databaseURL: "https://ingco-store-default-rtdb.firebaseio.com",
            projectId: "ingco-store",
            storageBucket: "ingco-store.firebasestorage.app",
            messagingSenderId: "286206400336",
            appId: "1:286206400336:web:f39161a02e514512d3fe55"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const adminChatId = "5667696089";

        window.cart = [];

        // 1. MAHSULOTLAR VA KATEGORIYALAR (AVVALGI FUNKSIYALAR)
        onValue(ref(db, '/'), (snapshot) => {
            const data = snapshot.val() || {};
            renderUI(data.products || {}, data.categories || {});
            renderNews(data.news || {});
        });

        // 2. YANGILIKLARNI CHIZISH
        function renderNews(newsData) {
            const newsBox = document.getElementById('news-list');
            newsBox.innerHTML = '';
            for (let id in newsData) {
                const n = newsData[id];
                newsBox.innerHTML += `
                    <div class="news-card">
                        ${window.myId == adminChatId ? `<i class="fa fa-trash delete-icon" onclick="delNews('${id}')"></i>` : ''}
                        ${n.link.includes('mp4') || n.link.includes('video') ? 
                            `<video src="${n.link}" controls style="width:100%; border-radius:10px;"></video>` : 
                            `<img src="${n.link}" onerror="this.src='https://via.placeholder.com/300x150?text=Yangilik'">`}
                        <h4>${n.title}</h4>
                        <p>${n.desc}</p>
                        <div style="display:flex; justify-content:space-between; align-items:center;">
                            <b style="color:#d35400;">${Number(n.price).toLocaleString()} so'm</b>
                            <button class="btn-main" style="width:auto; padding:5px 15px;" onclick="addToCart('${n.title}', ${n.price})">🛒+Savatcha</button>
                        </div>
                    </div>`;
            }
        }

        // 3. ADMIN: YANGILIK QO'SHISH
        window.addNews = () => {
            const link = document.getElementById('n_link').value;
            const title = document.getElementById('n_title').value;
            const desc = document.getElementById('n_desc').value;
            const price = document.getElementById('n_price').value;
            if(link && title && desc && price) {
                push(ref(db, 'news'), { link, title, desc, price });
                alert("Yangilik e'lon qilindi!");
                document.getElementById('news-form').reset();
            } else { alert("Barcha maydonlarni to'ldiring!"); }
        };

        window.delNews = (id) => { if(confirm("O'chirish?")) remove(ref(db, `news/${id}`)); };

        // --- AVVALGI FUNKSIYALARNING DAVOMI ---
        function renderUI(products, categories) {
            const list = document.getElementById('product-list');
            list.innerHTML = '';
            for (let id in products) {
                const p = products[id];
                list.innerHTML += `<div class="product-card">
                    ${window.myId == adminChatId ? `<i class="fa fa-trash delete-icon" onclick="delProd('${id}')"></i>` : ''}
                    <img src="${p.img}">
                    <p class="p-name">${p.name}</p>
                    <p class="price">${Number(p.newP).toLocaleString()} so'm</p>
                    <button class="btn-main" onclick="addToCart('${p.name}', ${p.newP})">🛒 Savatga</button>
                </div>`;
            }
            // Admin select uchun kataloglarni yangilash
            const select = document.getElementById('p_cat');
            if(select) {
                select.innerHTML = '<option value="">Katalog tanlang</option>';
                Object.values(categories).forEach(c => select.innerHTML += `<option value="${c}">${c}</option>`);
            }
        }

        window.addToCart = (n, p) => {
            window.cart.push({name: n, price: p});
            document.getElementById('cart-count').innerText = window.cart.length;
            Telegram.WebApp.HapticFeedback.notificationOccurred('success');
        };

        window.showPage = (id, el) => {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active-nav'));
            el.classList.add('active-nav');
        };
        
        window.addCat = () => { const n = document.getElementById('new_cat').value; if(n) push(ref(db, 'categories'), n); };
        window.addProd = () => {
            const n = document.getElementById('p_name').value, pr = document.getElementById('p_price').value, 
                  im = document.getElementById('p_img').value, ct = document.getElementById('p_cat').value;
            if(n && pr && im && ct) push(ref(db, 'products'), {name:n, newP:pr, img:im, category:ct});
        };
        window.delProd = (id) => remove(ref(db, `products/${id}`));
    </script>

    <style>
        :root { --main: #f39c12; }
        body { font-family: sans-serif; margin: 0; background: #f4f4f4; padding-bottom: 70px; }
        .page { display: none; padding: 15px; }
        .active { display: block; }
        .news-card { background: #fff; padding: 15px; border-radius: 15px; margin-bottom: 15px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); position: relative; }
        .news-card img { width: 100%; border-radius: 10px; margin-bottom: 10px; }
        .catalog-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .product-card { background: #fff; padding: 10px; border-radius: 12px; text-align: center; position: relative; }
        .product-card img { width: 100%; height: 110px; object-fit: contain; }
        .price { color: #d35400; font-weight: bold; }
        .btn-main { background: var(--main); border: none; padding: 12px; width: 100%; border-radius: 8px; font-weight: bold; cursor: pointer; }
        .nav-bar { position: fixed; bottom: 0; width: 100%; background: #fff; display: flex; border-top: 1px solid #ddd; height: 65px; z-index: 1000; }
        .nav-item { flex: 1; text-align: center; padding: 10px 0; font-size: 11px; color: #888; position: relative; }
        .active-nav { color: var(--main); }
        #cart-count { position: absolute; top: 5px; right: 20%; background: red; color: white; border-radius: 50%; padding: 2px 6px; font-size: 10px; }
        .delete-icon { position: absolute; top: 10px; left: 10px; color: red; background: #fff; border-radius: 50%; padding: 5px; }
        input, select, textarea { width: 100%; padding: 12px; margin: 5px 0; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; }
    </style>
</head>
<body>

<div id="home" class="page active">
    <div id="category-scroll" class="category-scroll"></div>
    <div class="catalog-grid" id="product-list"></div>
</div>

<div id="news-page" class="page">
    <h3 style="text-align:center;"><i class="fa fa-bell"></i> Yangiliklar</h3>
    <div id="news-list"></div>
</div>

<div id="profile" class="page">
    <div id="admin-panel" style="display:none;">
        <div style="background:#fff; padding:15px; border-radius:15px; border:2px solid var(--main);">
            <h4>📢 Yangilik e'lon qilish</h4>
            <form id="news-form">
                <input type="text" id="n_link" placeholder="Rasm yoki Video linki">
                <input type="text" id="n_title" placeholder="Sarlavha (Tavar nomi)">
                <textarea id="n_desc" placeholder="Tavar haqida batafsil ma'lumot"></textarea>
                <input type="number" id="n_price" placeholder="Narxi">
                <button type="button" class="btn-main" onclick="addNews()">E'LON QILISH</button>
            </form>
        </div>
        <hr>
        <h3>📁 Katalog & 📦 Tavar</h3>
        <input type="text" id="new_cat" placeholder="Katalog nomi">
        <button class="btn-main" onclick="addCat()">Katalog Qo'shish</button>
        <hr>
        <select id="p_cat"></select>
        <input type="text" id="p_img" placeholder="Tavar Rasm URL">
        <input type="text" id="p_name" placeholder="Tavar Nomi">
        <input type="number" id="p_price" placeholder="Narxi">
        <button class="btn-main" onclick="addProd()">Tavar Qo'shish</button>
    </div>
</div>

<div class="nav-bar">
    <div class="nav-item active-nav" onclick="showPage('home', this)"><i class="fa fa-th-large"></i><br>Katalog</div>
    <div class="nav-item" onclick="showPage('news-page', this)"><i class="fa fa-bell"></i><br>Yangiliklar</div>
    <div class="nav-item" onclick="alert('Savatga o\'ting')"><span id="cart-count">0</span><i class="fa fa-shopping-cart"></i><br>Savat</div>
    <div class="nav-item" id="admin-tab" style="display:none;" onclick="showPage('profile', this)"><i class="fa fa-user-cog"></i><br>Admin</div>
</div>

<script>
    let tg = window.Telegram.WebApp;
    tg.expand();
    window.myId = tg.initDataUnsafe.user?.id || "AdminTest";
    if(window.myId == "5667696089") {
        document.getElementById('admin-tab').style.display = 'block';
        document.getElementById('admin-panel').style.display = 'block';
    }
</script>
</body>
</html>
